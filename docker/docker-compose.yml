version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: morphe_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morphe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morphe_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-morphe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morphe_user} -d ${POSTGRES_DB:-morphe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: morphe_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: morphe_grobid
    restart: always
    ports:
      - "8070:8070"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: morphe_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-morphe_user}:${POSTGRES_PASSWORD:-morphe_secret_password}@postgres:5432/${POSTGRES_DB:-morphe_db}
      - REDIS_URL=redis://redis:6379/0
      - GROBID_URL=http://grobid:8070
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: morphe_web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
